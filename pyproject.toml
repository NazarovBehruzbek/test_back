[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aqlliolam-vms"
version = "0.1.0"
description = "AqlliOlam — Corporate Visitor Management System REST API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.30.0",
    "django>=5.1,<7.0",
    "fastapi>=0.115.0",
    "fpdf2>=2.8.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pwdlib[argon2]>=0.2.1",
    "pydantic-settings>=2.7.0",
    "pydantic[email]>=2.10.0",
    "pyjwt[crypto]>=2.10.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "tzdata>=2024.2",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "django_admin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
